<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="주파수가 높을수록 물결이 촘촘해지고 파장은 짧아지는 것을 보여주는 그림">

  <!-- 배경: 다크모드 대비용 흰색 -->
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

