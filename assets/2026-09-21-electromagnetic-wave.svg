<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="안테나에서 전기장과 자기장이 서로를 만들며 퍼져나가는 전자기파 모식도">

  <!-- 배경: 다크모드 대비용 흰색 -->
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">

    <!-- 제목 -->
    <text x="24" y="34" font-size="17" font-weight="bold" fill="#1a1a1a">
      전파(전자기파)는 어떻게 허공을 퍼져나가는가
    </text>
    <text x="24" y="56" font-size="13" fill="#444444">
      안테나에 전류를 흘려보내면, 전기장과 자기장이 번갈아 서로를 만들며 공간으로 퍼져나간다
    </text>

    <!-- 안테나 -->
    <g stroke="#1a1a1a" stroke-width="2.5">
      <line x1="60" y1="120" x2="60" y2="220"/>
    </g>
    <circle cx="60" cy="115" r="4" fill="#1a1a1a"/>
    <circle cx="60" cy="225" r="4" fill="#1a1a1a"/>
    <text x="60" y="248" font-size="13" fill="#1a1a1a" text-anchor="middle">안테나</text>
    <text x="60" y="264" font-size="12" fill="#666666" text-anchor="middle">(전류가 빠르게</text>
    <text x="60" y="278" font-size="12" fill="#666666" text-anchor="middle">진동하는 곳)</text>

    <!-- 전기장 파형 (실선, 파란색) -->
    <path d="M 110 170
             C 140 120, 170 120, 200 170
             C 230 220, 260 220, 290 170
             C 320 120, 350 120, 380 170
             C 410 220, 440 220, 470 170
             C 500 120, 530 120, 560 170
             C 590 220, 620 220, 650 170"
          fill="none" stroke="#2a6fb0" stroke-width="2.5"/>

    <!-- 자기장 파형 (점선, 빨간색, 위상은 같되 얇게 표시해 '함께 진동'함을 표현) -->
    <path d="M 110 170
             C 140 195, 170 195, 200 170
             C 230 145, 260 145, 290 170
             C 320 195, 350 195, 380 170
             C 410 145, 440 145, 470 170
             C 500 195, 530 195, 560 170
             C 590 145, 620 145, 650 170"
          fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- 진행 방향 축 -->
    <line x1="110" y1="170" x2="670" y2="170" stroke="#999999" stroke-width="1"/>
    <path d="M 660 165 L 672 170 L 660 175 Z" fill="#999999"/>

    <!-- 범례 -->
    <line x1="480" y1="270" x2="510" y2="270" stroke="#2a6fb0" stroke-width="2.5"/>
    <text x="516" y="274" font-size="13" fill="#1a1a1a">전기장 (E)</text>
    <line x1="480" y1="292" x2="510" y2="292" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="516" y="296" font-size="13" fill="#1a1a1a">자기장 (B)</text>

    <!-- 축 이름 -->
    <text x="390" y="300" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
      공간을 따라 나아가는 방향 (빛의 속도로 이동)
    </text>

    <!-- 보조 설명 -->
    <text x="110" y="106" font-size="12" fill="#444444">
      실제로는 전기장과 자기장이 서로 직각(90도)으로 엇갈려 진동하지만, 이 그림은 이해를 돕기 위해 평면에 펼쳐 그렸다
    </text>
  </g>
</svg>
