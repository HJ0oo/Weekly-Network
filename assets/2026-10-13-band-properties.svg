<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="주파수가 낮을수록 멀리·벽 너머까지 가고, 높을수록 넓은 폭을 쓰지만 짧고 벽에 약하다">
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
    <text x="24" y="34" font-size="17" font-weight="bold" fill="#1a1a1a">주파수가 높아질수록 달라지는 것</text>
    <rect x="70" y="56" width="290" height="44" fill="#d9e8f5" stroke="#5b8db8"/>
    <rect x="360" y="56" width="290" height="44" fill="#f7e2e2" stroke="#c07777"/>
    <text x="215" y="76" font-size="14" fill="#1a1a1a" text-anchor="middle">낮은 쪽: 멀리 가고 벽을 잘 통과</text>
    <text x="215" y="94" font-size="13" fill="#1a1a1a" text-anchor="middle">대신 쓸 수 있는 폭이 좁다</text>
    <text x="505" y="76" font-size="14" fill="#1a1a1a" text-anchor="middle">높은 쪽: 넓은 폭, 빠르다</text>
    <text x="505" y="94" font-size="13" fill="#1a1a1a" text-anchor="middle">대신 짧게 가고 벽에 약하다</text>
    <line x1="70" y1="150" x2="650" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="115" y1="142" x2="115" y2="158" stroke="#1a1a1a" stroke-width="2"/>
    <text x="115" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">700MHz</text>
    <text x="115" y="198" font-size="13" fill="#1a1a1a" text-anchor="middle">LTE·5G 저대역</text>
    <line x1="278" y1="142" x2="278" y2="158" stroke="#1a1a1a" stroke-width="2"/>
    <text x="278" y="230" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2.4GHz</text>
    <text x="278" y="248" font-size="13" fill="#1a1a1a" text-anchor="middle">와이파이</text>
    <line x1="328" y1="142" x2="328" y2="158" stroke="#1a1a1a" stroke-width="2"/>
    <text x="328" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3.5GHz</text>
    <text x="328" y="198" font-size="13" fill="#1a1a1a" text-anchor="middle">5G 중대역</text>
    <line x1="375" y1="142" x2="375" y2="158" stroke="#1a1a1a" stroke-width="2"/>
    <text x="375" y="230" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5GHz</text>
    <text x="375" y="248" font-size="13" fill="#1a1a1a" text-anchor="middle">와이파이</text>
    <line x1="603" y1="142" x2="603" y2="158" stroke="#1a1a1a" stroke-width="2"/>
    <text x="603" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">28GHz</text>
    <text x="603" y="198" font-size="13" fill="#1a1a1a" text-anchor="middle">5G 초고대역</text>
    <text x="360" y="290" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">주파수 (GHz) — 오른쪽으로 갈수록 높다 (눈금 간격은 배수 기준)</text>
    <text x="24" y="316" font-size="13" fill="#444444">대표 대역만 표시한 개념도이며, 실제 도달 거리는 환경에 따라 다르다.</text>
  </g>
</svg>
